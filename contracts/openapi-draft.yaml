openapi: 3.0.3
info:
  title: Spendly API (hand-written draft)
  version: 0.1.0-draft
  description: |
    Hand-written draft of the Phase 1-3 endpoints (plan section 15). The frontend builds against
    it until the backend publishes its springdoc spec at /v3/api-docs; the published spec then
    becomes the source of truth.

    Conventions
    - All money values are decimal strings with exactly 2 fraction digits ("-123.45"); negative = money out.
    - Dates are ISO-8601 (`2026-08-10`), timestamps ISO-8601 UTC (`2026-08-10T09:14:22Z`).
    - Errors use RFC 7807 `application/problem+json` (ProblemDetail).
    - IBANs are write-only: sent once on account creation, returned only as `ibanMasked` (`RO**…0000`).
    - Every request may send `X-Correlation-Id`; the backend echoes it (or a generated one) in the response.
servers:
  - url: http://localhost:8080
tags:
  - name: accounts
  - name: statements
  - name: questions
  - name: transactions
  - name: counterparties

paths:
  /api/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: List registered accounts
      responses:
        '200':
          description: Accounts, ordered by label
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
    post:
      tags: [accounts]
      operationId: createAccount
      summary: Register an account (IBAN stored only as HMAC + last 4)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: An account with the same IBAN is already registered
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [accounts]
      operationId: getAccount
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [accounts]
      operationId: updateAccount
      summary: Update label/bank or close the account. IBAN, type and currency are immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [accounts]
      operationId: deleteAccount
      summary: Delete an account that has no statements
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The account still has statements
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/statements:
    get:
      tags: [statements]
      operationId: listStatements
      summary: List statements, newest first
      parameters:
        - name: accountId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/StatementStatus' }
      responses:
        '200':
          description: Statements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Statement' }
    post:
      tags: [statements]
      operationId: uploadStatement
      summary: Upload a statement file for an account
      description: |
        Saves the file to the temp upload folder, inserts the statement (UPLOADED) and the
        StatementUploaded outbox row in one transaction, and returns immediately.
        Re-uploading a file with the same SHA-256 for the same account does not import it again:
        the existing statement is returned with `duplicate: true` and status 200.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [accountId, file]
              properties:
                accountId: { type: string, format: uuid }
                file: { type: string, format: binary, description: 'CSV, XLS, XLSX or PDF, max 20 MB' }
      responses:
        '202':
          description: Accepted; processing continues asynchronously
          headers:
            Location: { schema: { type: string }, description: '/api/statements/{id}' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadAccepted' }
        '200':
          description: Duplicate file; the existing statement is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File too large
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: Unsupported file type
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/statements/{statementId}:
    parameters:
      - $ref: '#/components/parameters/StatementId'
    get:
      tags: [statements]
      operationId: getStatement
      summary: Status and progress (the UI derives its screen from `status`)
      responses:
        '200':
          description: The statement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statement' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/statements/{statementId}/retry:
    parameters:
      - $ref: '#/components/parameters/StatementId'
    post:
      tags: [statements]
      operationId: retryStatement
      summary: Retry a FAILED statement from statements.last_completed_step
      description: |
        The returned statement's `status` is where processing resumes: `UPLOADED` when nothing was
        completed (re-parse; needs the original file, else 409 `ORIGINAL_FILE_DELETED`), `PARSED` or
        later when a later step was completed (e.g. a missing FX rate filled in). The client then
        follows the status as usual.
      responses:
        '202':
          description: Retry scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/statements/{statementId}/events:
    parameters:
      - $ref: '#/components/parameters/StatementId'
    get:
      tags: [statements]
      operationId: streamStatementEvents
      summary: Server-Sent Events with status changes
      description: |
        Sends the current status immediately on connect, then one `status` event per transition.
        A comment line (`: keep-alive`) is sent every 15 s. The stream completes after a terminal
        status (CATEGORIZED, FAILED); clients fall back to polling GET /api/statements/{id} every 2 s
        if the stream drops.

        Wire format:
        ```
        event: status
        id: <monotonic sequence>
        data: {"statementId":"…","status":"PARSED","lastCompletedStep":"PARSE","error":null,"occurredAt":"…"}
        ```
      responses:
        '200':
          description: Event stream; each `data:` line is a StatementStatusEvent
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/StatementStatusEvent' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/statements/{statementId}/questions:
    parameters:
      - $ref: '#/components/parameters/StatementId'
    get:
      tags: [questions]
      operationId: getStatementQuestions
      summary: Unknown transactions with questions and suggestions (open ones first)
      responses:
        '200':
          description: Questions for this statement
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Question' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/statements/{statementId}/answers:
    parameters:
      - $ref: '#/components/parameters/StatementId'
    post:
      tags: [questions]
      operationId: submitAnswers
      summary: Submit answers for every open question of the statement and resume the flow
      description: |
        Accepted only while the statement is NEEDS_INPUT (guarded in SQL). Every open question of
        the statement must be answered or skipped. A second submit returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnswersSubmission' }
      responses:
        '202':
          description: Accepted; status is now CATEGORIZING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Statement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/questions:
    get:
      tags: [questions]
      operationId: listOpenQuestions
      summary: Questions (OPEN by default), including TRANSFER questions not tied to one statement
      parameters:
        - name: status
          in: query
          required: false
          description: Defaults to OPEN when omitted
          schema: { $ref: '#/components/schemas/QuestionStatus' }
      responses:
        '200':
          description: Questions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Question' }

  /api/questions/{questionId}/answer:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [questions]
      operationId: answerQuestion
      summary: Answer a single question (used for TRANSFER questions)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Answer' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Question' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/transactions:
    get:
      tags: [transactions]
      operationId: listTransactions
      summary: Filterable, paged transaction list (descriptions are sanitized plaintext)
      parameters:
        - { name: accountId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: statementId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: 'Booking date >= from' }
        - { name: to, in: query, required: false, schema: { type: string, format: date }, description: 'Booking date <= to (inclusive)' }
        - { name: category, in: query, required: false, schema: { $ref: '#/components/schemas/Category' } }
        - { name: transferStatus, in: query, required: false, schema: { $ref: '#/components/schemas/TransferStatus' } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: ['bookingDate,desc', 'bookingDate,asc', 'amount,desc', 'amount,asc'], default: 'bookingDate,desc' }
      responses:
        '200':
          description: One page of transactions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/transactions/{transactionId}:
    parameters:
      - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [transactions]
      operationId: getTransaction
      responses:
        '200':
          description: The transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/counterparties:
    get:
      tags: [counterparties]
      operationId: listCounterparties
      summary: Counterparties seen in transactions (pseudonymized), with optional user labels
      responses:
        '200':
          description: Counterparties, most recently seen first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Counterparty' }

  /api/counterparties/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9a-f]{64}$' }
    put:
      tags: [counterparties]
      operationId: updateCounterparty
      summary: Label a counterparty and/or mark it as one of your own accounts
      description: |
        Setting `isOwnAccount` re-runs transfer detection for that counterparty's transactions
        (step 4 in plan section 10): matching CANDIDATE/NONE transactions become INTERNAL, or back to
        their previous state when unset. Any change publishes TransactionsChanged
        (cause COUNTERPARTY_LABELLED) for the affected accounts and dates.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounterpartyUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Counterparty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StatementId:
      name: statementId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The resource is not in a state that allows this action (e.g. answers already submitted)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Money:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,14})\.[0-9]{2}$'
      example: '-123.45'

    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      example: RON

    AccountType:
      type: string
      enum: [CURRENT, SAVINGS, CREDIT_CARD, E_WALLET]

    Category:
      type: string
      enum: [GROCERIES, RESTAURANTS, FUEL, TRANSPORT, UTILITIES, RENT_MORTGAGE, SUBSCRIPTIONS, SHOPPING,
             HEALTH, SPORT, ENTERTAINMENT, TRAVEL, EDUCATION, PETS, CASH_WITHDRAWAL, BANK_FEES, CARD_INTEREST,
             FX_FEES, INSURANCE, TAXES, INCOME, INTERNAL_TRANSFER, OTHER]

    Account:
      type: object
      required: [id, label, bank, type, currency, ibanMasked, activeFrom, createdAt]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, example: BT current }
        bank: { type: string, example: BT }
        type: { $ref: '#/components/schemas/AccountType' }
        currency: { $ref: '#/components/schemas/Currency' }
        ibanMasked: { type: string, example: 'RO**…3333', description: 'Country code + "**…" + last 4' }
        cardLast4: { type: string, nullable: true, pattern: '^[0-9]{4}$' }
        activeFrom: { type: string, format: date }
        closedAt: { type: string, format: date, nullable: true }
        createdAt: { type: string, format: date-time }

    AccountCreate:
      type: object
      required: [label, bank, type, currency, iban, activeFrom]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        bank: { type: string, minLength: 1, maxLength: 100 }
        type: { $ref: '#/components/schemas/AccountType' }
        currency: { $ref: '#/components/schemas/Currency' }
        iban:
          type: string
          writeOnly: true
          description: Full IBAN (spaces allowed). Validated with mod-97, then stored only as HMAC + last 4.
          example: RO54 SPND 0000 1111 2222 3333
        cardLast4: { type: string, nullable: true, pattern: '^[0-9]{4}$' }
        activeFrom: { type: string, format: date }

    AccountUpdate:
      type: object
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        bank: { type: string, minLength: 1, maxLength: 100 }
        cardLast4: { type: string, nullable: true, pattern: '^[0-9]{4}$' }
        closedAt: { type: string, format: date, nullable: true }

    FileType:
      type: string
      enum: [CSV, XLS, XLSX, PDF]

    StatementStatus:
      type: string
      enum: [UPLOADED, PARSED, CATEGORIZING, NEEDS_INPUT, CATEGORIZED, FAILED]

    ProcessingStep:
      type: string
      description: Last step completed successfully; a retry resumes after it
      enum: [UPLOAD, PARSE, TRANSFER_DETECTION, CATEGORIZE, APPLY_ANSWERS]

    StatementError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: BALANCE_MISMATCH
          description: |
            Open set; clients show `message` for unknown codes. Known values:
            the StatementParseFailed reasons (BALANCE_MISMATCH, UNSUPPORTED_LAYOUT, NO_TRANSACTIONS,
            FILE_NOT_FOUND, FILE_UNREADABLE, SCHEMA_VALIDATION, INTERNAL_ERROR), FX_RATE_MISSING
            (no BNR rate for a booking date; retry after importing rates), DLQ (gave up after retries).
        message: { type: string }
        retryable: { type: boolean }

    StatementProgress:
      type: object
      properties:
        transactionsImported: { type: integer, minimum: 0 }
        transactionsCategorized: { type: integer, minimum: 0 }
        questionsOpen: { type: integer, minimum: 0 }

    CategoryTotal:
      type: object
      required: [category, amountBase, count]
      properties:
        category: { $ref: '#/components/schemas/Category' }
        amountBase: { $ref: '#/components/schemas/Money' }
        count: { type: integer }

    StatementSummary:
      type: object
      description: |
        Present once the statement is CATEGORIZED (null before). All amounts are in the base currency
        and are absolute (non-negative) values. `spendBase` and `incomeBase` exclude INTERNAL transfers.
        `byCategory` lists spending categories plus INCOME, never INTERNAL_TRANSFER.
      required: [transactionCount, spendBase, incomeBase, internalTransferCount, byCategory]
      properties:
        transactionCount: { type: integer }
        spendBase: { $ref: '#/components/schemas/Money' }
        incomeBase: { $ref: '#/components/schemas/Money' }
        internalTransferCount: { type: integer }
        byCategory:
          type: array
          items: { $ref: '#/components/schemas/CategoryTotal' }

    Statement:
      type: object
      required: [id, accountId, fileType, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        fileType: { $ref: '#/components/schemas/FileType' }
        status: { $ref: '#/components/schemas/StatementStatus' }
        lastCompletedStep:
          allOf: [{ $ref: '#/components/schemas/ProcessingStep' }]
          nullable: true
        periodStart: { type: string, format: date, nullable: true, description: 'Known after PARSED' }
        periodEnd: { type: string, format: date, nullable: true }
        error:
          allOf: [{ $ref: '#/components/schemas/StatementError' }]
          nullable: true
        progress: { $ref: '#/components/schemas/StatementProgress' }
        summary:
          allOf: [{ $ref: '#/components/schemas/StatementSummary' }]
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UploadAccepted:
      type: object
      required: [statementId, status, duplicate]
      properties:
        statementId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StatementStatus' }
        duplicate: { type: boolean }

    StatementStatusEvent:
      type: object
      required: [statementId, status, occurredAt]
      properties:
        statementId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StatementStatus' }
        lastCompletedStep:
          allOf: [{ $ref: '#/components/schemas/ProcessingStep' }]
          nullable: true
        error:
          allOf: [{ $ref: '#/components/schemas/StatementError' }]
          nullable: true
        occurredAt: { type: string, format: date-time }

    QuestionKind:
      type: string
      enum: [CATEGORY, TRANSFER]

    QuestionStatus:
      type: string
      enum: [OPEN, ANSWERED, SKIPPED]

    QuestionTransaction:
      type: object
      required: [id, accountId, bookingDate, amount, currency, description]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        accountLabel: { type: string }
        bookingDate: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        amountBase: { $ref: '#/components/schemas/Money' }
        description: { type: string, description: Sanitized description }

    Question:
      type: object
      required: [id, kind, transaction, questionText, suggestions, status]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/QuestionKind' }
        statementId: { type: string, format: uuid, nullable: true, description: 'Null for TRANSFER questions raised by coverage' }
        transaction: { $ref: '#/components/schemas/QuestionTransaction' }
        questionText: { type: string, example: 'Is SC ALFA TRADE SRL a gym, a supplier, or a person?' }
        suggestions:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Category' }
          description: 'For TRANSFER questions: [INTERNAL_TRANSFER] plus the best spending categories'
        status: { $ref: '#/components/schemas/QuestionStatus' }

    Answer:
      type: object
      description: |
        Exactly one of `category` or `skip=true`. With `skip=true`, `category` may be omitted or null.
        Skip maps to OTHER and never blocks the flow.

        TRANSFER questions ("Is this a transfer to one of your accounts?"): `category: INTERNAL_TRANSFER`
        means yes (the transaction becomes INTERNAL); any other category means no (EXTERNAL with that
        category); skip means EXTERNAL + OTHER. `applyToFuture` on a TRANSFER answer marks the
        counterparty as own account (when the transaction has a counterparty token).
      properties:
        category:
          allOf: [{ $ref: '#/components/schemas/Category' }]
          nullable: true
        skip: { type: boolean, default: false }
        hint: { type: string, maxLength: 500, nullable: true }
        applyToFuture: { type: boolean, default: false }

    AnswerItem:
      allOf:
        - type: object
          required: [questionId]
          properties:
            questionId: { type: string, format: uuid }
        - $ref: '#/components/schemas/Answer'

    AnswersSubmission:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/AnswerItem' }

    TransferStatus:
      type: string
      enum: [NONE, CANDIDATE, INTERNAL, EXTERNAL]
      description: INTERNAL = between your own accounts (excluded from all totals); CANDIDATE = looks like one, unconfirmed (excluded, shown as "unconfirmed transfer")

    CategorySource:
      type: string
      enum: [RULE, EMBEDDING, LLM, USER, TRANSFER_MATCH]

    CounterpartyRef:
      type: object
      required: [token, isOwnAccount]
      properties:
        token: { type: string, pattern: '^[0-9a-f]{64}$', description: 'HMAC token (IBAN or person); never the raw value' }
        kind: { type: string, enum: [IBAN, PERSON], nullable: true }
        label: { type: string, nullable: true, example: Landlord }
        isOwnAccount: { type: boolean }
        ownAccountId: { type: string, format: uuid, nullable: true, description: 'Set when the token equals a registered account''s iban_hash' }

    Transaction:
      type: object
      required: [id, accountId, statementId, bookingDate, amount, currency, description, transferStatus]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        accountLabel: { type: string }
        statementId: { type: string, format: uuid }
        bookingDate: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        amountBase: { allOf: [{ $ref: '#/components/schemas/Money' }], nullable: true }
        fxRate: { type: string, nullable: true, example: '4.9731' }
        description: { type: string, description: Sanitized description }
        category: { allOf: [{ $ref: '#/components/schemas/Category' }], nullable: true }
        categorySource: { allOf: [{ $ref: '#/components/schemas/CategorySource' }], nullable: true }
        confidence: { type: number, minimum: 0, maximum: 1, nullable: true }
        transferStatus: { $ref: '#/components/schemas/TransferStatus' }
        transferPairId: { type: string, format: uuid, nullable: true }
        pairedTransactionId: { type: string, format: uuid, nullable: true, description: 'The other side of the transfer pair, for the "Transfer" badge link' }
        counterparty: { allOf: [{ $ref: '#/components/schemas/CounterpartyRef' }], nullable: true }

    TransactionPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }

    Counterparty:
      allOf:
        - $ref: '#/components/schemas/CounterpartyRef'
        - type: object
          required: [transactionCount]
          properties:
            transactionCount: { type: integer }
            lastSeen: { type: string, format: date, nullable: true }
            sampleDescription: { type: string, nullable: true, description: 'One sanitized description, to help the user recognise it' }

    CounterpartyUpdate:
      type: object
      required: [isOwnAccount]
      properties:
        label: { type: string, maxLength: 80, nullable: true }
        isOwnAccount: { type: boolean }

    Problem:
      type: object
      description: RFC 7807 problem details
      properties:
        type: { type: string, format: uri, example: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: 'Machine-readable error code, e.g. STATEMENT_NOT_IN_NEEDS_INPUT' }
        errors:
          type: array
          description: Field validation errors
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
