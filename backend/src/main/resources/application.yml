# Spendly backend configuration.
# Every value comes from the environment variables documented in ../.env.example. When ../.env exists
# (git-ignored), it is imported as a properties file so `./gradlew bootRun` from backend/ just works.
# Tests point SPENDLY_ENV_FILE at a missing file, so they never read the developer's secrets.
spring:
  application:
    name: spendly-backend
  config:
    import: optional:file:${SPENDLY_ENV_FILE:../.env}[.properties]
  datasource:
    url: ${SPENDLY_DB_URL:jdbc:postgresql://localhost:5432/spendly}
    username: ${SPENDLY_DB_USER:spendly}
    password: ${SPENDLY_DB_PASSWORD:}
    hikari:
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 20
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 10000
        delivery.timeout.ms: 15000
    listener:
      ack-mode: record
      missing-topics-fatal: false
    admin:
      fail-fast: false
      properties:
        request.timeout.ms: 5000
        default.api.timeout.ms: 5000
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen3:8b}
          temperature: 0.1
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 768
    # Never log prompts or completions (they may contain transaction descriptions).
    chat:
      observations:
        log-prompt: false
        log-completion: false
      client:
        observations:
          log-prompt: false
          log-completion: false
  servlet:
    multipart:
      max-file-size: ${SPENDLY_UPLOAD_MAX_SIZE_MB:20}MB
      max-request-size: ${SPENDLY_UPLOAD_MAX_SIZE_MB:20}MB
      file-size-threshold: 1MB
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
      status:
        # DEGRADED (Ollama unreachable) and DISABLED (LLM off) never make the whole app DOWN:
        # the LLM is an enhancement, not a dependency (plan section 3).
        order: down,out-of-service,up,degraded,disabled,unknown

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.apache.kafka: WARN
    org.springframework.ai: WARN

spendly:
  base-currency: ${SPENDLY_BASE_CURRENCY:RON}
  # Absolute path of the shared contracts/ folder; falls back to ../contracts (relative to backend/).
  contracts-dir: ${SPENDLY_CONTRACTS_DIR:}
  llm:
    enabled: ${SPENDLY_LLM_ENABLED:true}
  ollama:
    health-timeout: 2s
  secrets:
    hmac-secret-path: ${SPENDLY_HMAC_SECRET_PATH:}
    aes-key: ${SPENDLY_AES_KEY:}
  upload:
    dir: ${SPENDLY_UPLOAD_DIR:}
    retention: ${SPENDLY_UPLOAD_RETENTION:PT0S}
    max-size-mb: ${SPENDLY_UPLOAD_MAX_SIZE_MB:20}
  outbox:
    relay-enabled: true
    poll-interval: 500ms
    batch-size: 50
    send-timeout: 10s
  kafka:
    retry-initial-interval: 1s
    retry-multiplier: 2.0
    retry-max-attempts: 3
  sse:
    keep-alive: 15s
    emitter-timeout: 30m
  fx:
    max-lookback-days: 10
    bnr:
      enabled: true
      daily-url: https://curs.bnr.ro/nbrfxrates.xml
      yearly-url-template: https://curs.bnr.ro/files/xml/years/nbrfxrates{year}.xml
      # BNR publishes around 13:00 Romanian time on banking days.
      cron: "0 30 13 * * MON-FRI"
      zone: Europe/Bucharest
      timeout: 10s
