# Spendly local infrastructure.
# Ollama is NOT containerized: it runs on the host at http://localhost:11434
# (containers reach it at http://host.docker.internal:11434).
#
# Usage:  cp .env.example .env   (then fill in secrets)
#         docker compose up -d
name: spendly

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spendly}
      POSTGRES_USER: ${POSTGRES_USER:-spendly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redpanda:
    image: redpandadata/redpanda:v26.2.4
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --default-log-level=warn
      # internal listener for containers, external listener for host processes (backend, tests)
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${KAFKA_EXTERNAL_PORT:-19092}
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "${KAFKA_EXTERNAL_PORT:-19092}:19092"
      - "${REDPANDA_ADMIN_PORT:-9644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # One-shot: creates the topics listed in contracts/README.md with short retention (24 h).
  redpanda-init:
    image: redpandadata/redpanda:v26.2.4
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for base in spendly.statement-uploaded spendly.transactions-imported spendly.statement-parse-failed \
                    spendly.statement-parsed spendly.input-required spendly.answers-submitted spendly.transactions-changed; do
          for t in "$$base" "$$base.dlq"; do
          if rpk topic describe "$$t" -X brokers=redpanda:9092 >/dev/null 2>&1; then
            echo "topic $$t exists"
          else
            rpk topic create "$$t" -X brokers=redpanda:9092 -p 3 -r 1 -c retention.ms=86400000
          fi
          done
        done
    restart: "no"

  console:
    image: redpandadata/console:v3.12.0
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # --- Phase 2: Python PDF parser (owned by apps/pdf-parser/) -------------------
  pdf-parser:
    build: ./apps/pdf-parser
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      SPENDLY_UPLOAD_DIR: /data/uploads
      SPENDLY_HMAC_SECRET_PATH: /run/secrets/hmac.key
      SPENDLY_CONTRACTS_DIR: /contracts
      PDF_PARSER_PORT: "8090"   # container port is fixed; the host port comes from .env below
    volumes:
      - ${SPENDLY_UPLOAD_DIR:?set SPENDLY_UPLOAD_DIR in .env}:/data/uploads
      - ${SPENDLY_HMAC_SECRET_PATH:?set SPENDLY_HMAC_SECRET_PATH in .env}:/run/secrets/hmac.key:ro
      - ./contracts:/contracts:ro
    ports:
      - "${PDF_PARSER_PORT:-8090}:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  postgres-data:
  redpanda-data:
