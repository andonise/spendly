# Shared contracts: every event example must validate against its JSON Schema.
name: contracts

on:
  push:
    branches: [main]
    paths: &paths
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate examples
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"

      # Same versions as the pdf-parser lock file.
      - name: Validate event examples against the schemas
        run: >-
          uv run --no-project --with jsonschema==4.26.0 --with referencing==0.37.0
          python contracts/tools/validate_examples.py
